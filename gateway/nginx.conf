events {}

http {
  # Docker's built-in DNS, so Nginx can find services by name
  # (re-checks every 10s, which also lets it find new replicas)
  resolver 127.0.0.11 valid=10s;

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /health {
      return 200 'ok';
    }

    # Internal-only routes: only the Booking Service may call these,
    # and it talks to the Event Service directly, so block them here
    location ~ ^/api/v1/events/[0-9]+/(reserve|release)$ {
      return 403;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      set $upstream http://user-service:3001;
      proxy_pass $upstream;
    }

    location /api/v1/events {
      limit_req zone=api burst=20 nodelay;
      set $upstream http://event-service:3002;
      proxy_pass $upstream;
    }

    location /api/v1/bookings {
      limit_req zone=api burst=20 nodelay;
      set $upstream http://booking-service:3003;
      proxy_pass $upstream;
    }

    location / {
      return 404;
    }
  }
}