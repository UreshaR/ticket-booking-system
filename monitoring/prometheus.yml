global:
  scrape_interval: 15s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ['user-service:3001']
  - job_name: event-service
    static_configs:
      - targets: ['event-service:3002']
  - job_name: booking-service
    static_configs:
      - targets: ['booking-service:3003']
  - job_name: notification-service
    static_configs:
      - targets: ['notification-service:3004']
  - job_name: review-service
    static_configs:
      - targets: ['review-service:3005']
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']