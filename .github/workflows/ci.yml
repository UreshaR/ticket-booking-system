name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # 1. Check each service on its own
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, event-service, booking-service, notification-service, review-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # 2. Start the whole system and test it end to end
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the full stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke test through the gateway
        run: |
          set -e
          curl -fsk https://localhost:8443/health
          echo
          curl -fsk -X POST https://localhost:8443/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI User","email":"ci@example.com","password":"password123"}'
          echo
          TOKEN=$(curl -fsk -X POST https://localhost:8443/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"password123"}' | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "Events returned: $(curl -fsk https://localhost:8443/api/v1/events | jq length)"
          curl -fsk -X POST https://localhost:8443/api/v1/bookings \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"event_id":1,"quantity":1}'
          echo
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' -X PATCH https://localhost:8443/api/v1/events/1/reserve)
          echo "Internal route status: $CODE (expected 403)"
          test "$CODE" = "403"
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --tail=60
      - name: Clean up
        if: always()
        run: docker compose down -v

  # 3. Build the images (and publish them when the code is on main)
  images:
    needs: [test, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: user-service, context: services/user-service }
          - { name: event-service, context: services/event-service }
          - { name: booking-service, context: services/booking-service }
          - { name: notification-service, context: services/notification-service }
          - { name: notification-service, context: services/notification-service }
          - { name: review-service, context: services/review-service }
          - { name: gateway, context: gateway }
          - { name: gateway, context: gateway }
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase the owner name (registries require lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/ticket-${{ matrix.name }}:latest
            ghcr.io/${{ env.OWNER }}/ticket-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}