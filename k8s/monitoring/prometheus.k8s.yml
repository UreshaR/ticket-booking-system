global:
  scrape_interval: 15s

scrape_configs:
  - job_name: services
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [ticket]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: (user|event|booking|notification|review)-service
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod