events {}

http {
  server_tokens off;   # hides the Nginx version in error pages

  

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
  limit_req_status 429;

  # Plain HTTP: only redirects to HTTPS
  server {
    listen 80;
    return 308 https://$host:8443$request_uri;
  }

  # HTTPS: the real gateway
  server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /health {
      return 200 'ok';
    }

    # Internal-only routes
    location ~ ^/api/v1/events/[0-9]+/(reserve|release)$ {
      return 403;
    }

        location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://user-service:3001;
    }

    location /api/v1/events {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://event-service:3002;
    }

    location /api/v1/bookings {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://booking-service:3003;
    }
    location / {
      return 404;
    }
  }
}