services:

  # ---------- Databases and infrastructure ----------
  users-db:
    image: postgres:16
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - users-data:/var/lib/postgresql/data
      - ./db/user-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usersdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  events-db:
    image: postgres:16
    environment:
      POSTGRES_DB: eventsdb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - events-data:/var/lib/postgresql/data
      - ./db/event-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/event-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eventsdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bookings-db:
    image: postgres:16
    environment:
      POSTGRES_DB: bookingsdb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bookings-data:/var/lib/postgresql/data
      - ./db/booking-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookingsdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ticket
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports:
      - "15672:15672"   # dashboard, for demo screenshots
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ---------- Application services ----------
  user-service:
    build: ./services/user-service
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@users-db:5432/usersdb
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  event-service:
    build: ./services/event-service
    environment:
      PORT: 3002
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@events-db:5432/eventsdb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      events-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  booking-service:
    build: ./services/booking-service
    environment:
      PORT: 3003
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@bookings-db:5432/bookingsdb
      EVENT_SERVICE_URL: http://event-service:3002
      RABBITMQ_URL: amqp://ticket:${RABBIT_PASSWORD}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      bookings-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      event-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  notification-service:
    build: ./services/notification-service
    environment:
      PORT: 3004
      RABBITMQ_URL: amqp://ticket:${RABBIT_PASSWORD}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---------- Gateway (the only public entry point) ----------
  gateway:
    build: ./gateway
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  users-data:
  events-data:
  bookings-data:
  rabbit-data: